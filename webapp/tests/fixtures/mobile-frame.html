<!doctype html>
<!-- Visual review helper: renders the app path given after # in a true 390px viewport (headless
     browsers enforce a wider minimum window). Served same-origin by tests/visual.vite.config.ts. -->
<html>
  <body style="margin: 0; background: #000">
    <iframe id="frame" title="Mobile viewport" style="width: 390px; height: 900px; border: 0; display: block"></iframe>
    <script>
      document.getElementById('frame').src = decodeURIComponent(location.hash.slice(1))
    </script>
  </body>
</html>
