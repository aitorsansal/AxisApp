<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/email-assets/favicon.svg?v=axis-brand-2">
  <link rel="shortcut icon" href="/email-assets/favicon.ico?v=axis-brand-2">
  <link rel="apple-touch-icon" href="/email-assets/apple-touch-icon.png?v=axis-brand-2">
  <meta name="theme-color" content="#0B1220">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your Axis password</title>
<style>
  :root {
    --bg: #0B1220;
    --card: #121A2B;
    --text: #E8ECF4;
    --muted: #8A93A6;
    --accent: #3D7EFF;
    --accent2: #F5A623;
    --border: #22304A;
    --danger: #F2545B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px 28px;
    text-align: center;
  }
  .mark {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    margin: 0 auto 20px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 8px; }
  p { color: var(--muted); line-height: 1.5; margin: 0 0 24px; font-size: 0.95rem; }
  input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 1rem;
    margin-bottom: 12px;
    font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--accent); }
  .pw { position: relative; margin-bottom: 12px; }
  .pw input { margin-bottom: 0; padding-right: 48px; }
  .pw-toggle {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
  }
  .pw-toggle:hover { color: var(--text); }
  .pw-toggle svg { width: 18px; height: 18px; }
  .pw-toggle .eye-off, .pw-toggle[aria-pressed="true"] .eye { display: none; }
  .pw-toggle[aria-pressed="true"] .eye-off { display: block; }
  .btn {
    display: block;
    width: 100%;
    padding: 14px 20px;
    border-radius: 12px;
    border: none;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    margin-bottom: 12px;
    font-family: inherit;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:disabled { opacity: 0.6; cursor: default; }
  .msg { font-size: 0.85rem; margin: 0 0 16px; text-align: left; }
  .msg-error { color: var(--danger); }
  .msg-success { color: var(--accent); }
  form[hidden], .msg[hidden], .btn[hidden] { display: none; }
</style>
</head>
<body>
  <div class="card">
    <img class="mark" src="/email-assets/icon.svg" width="48" height="48" alt="Axis">
    <h1 id="title">Reset your password</h1>
    <p id="subtitle">Choose a new password for your Axis account.</p>

    <p class="msg msg-error" id="errorMsg" hidden></p>
    <p class="msg msg-success" id="successMsg" hidden></p>

    <form id="resetForm" hidden>
      <div class="pw">
        <input type="password" id="password" placeholder="New password" autocomplete="new-password" minlength="8" required>
        <button type="button" class="pw-toggle" data-target="password" aria-label="Show password" aria-pressed="false"></button>
      </div>
      <div class="pw">
        <input type="password" id="confirmPassword" placeholder="Confirm new password" autocomplete="new-password" minlength="8" required>
        <button type="button" class="pw-toggle" data-target="confirmPassword" aria-label="Show password" aria-pressed="false"></button>
      </div>
      <button class="btn btn-primary" type="submit" id="submitBtn">Set new password</button>
    </form>

    <a class="btn btn-primary" id="webLink" href="/" hidden>Open Axis on the web</a>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  var SUPABASE_URL = "https://foepkovwmwyygulbdahv.supabase.co";
  var SUPABASE_PUBLISHABLE_KEY = "sb_publishable_h7tpW4wGOAwyKteJMq43zw_g9zegq_K";

  var client = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  var form = document.getElementById('resetForm');
  var errorMsg = document.getElementById('errorMsg');
  var successMsg = document.getElementById('successMsg');
  var submitBtn = document.getElementById('submitBtn');
  var title = document.getElementById('title');
  var subtitle = document.getElementById('subtitle');
  var webLink = document.getElementById('webLink');

  // Lucide eye / eye-off (ISC), same glyphs the apps use for their password toggles.
  var EYE_ICONS =
    '<svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>' +
    '<svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/>' +
    '<path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>';

  Array.prototype.forEach.call(document.querySelectorAll('.pw-toggle'), function (toggle) {
    toggle.innerHTML = EYE_ICONS;
    toggle.addEventListener('click', function () {
      var input = document.getElementById(toggle.getAttribute('data-target'));
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      toggle.setAttribute('aria-pressed', show ? 'true' : 'false');
      toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });
  });

  function showError(text) {
    errorMsg.textContent = text;
    errorMsg.hidden = false;
  }

  function invalidLink() {
    title.textContent = 'This link is invalid or expired';
    subtitle.textContent = 'Password reset links only work once and expire after a while. Go back to Axis and request a new one from the login screen.';
    webLink.hidden = false;
  }

  // The Supabase JS client auto-parses the recovery token out of the URL on load
  // (detectSessionInUrl, on by default) and fires this with a real, usable session —
  // no server call needed here. If it never fires, there was no valid recovery token in the URL.
  var recoveryReady = false;
  client.auth.onAuthStateChange(function (event, session) {
    if (event === 'PASSWORD_RECOVERY' && session) {
      recoveryReady = true;
      form.hidden = false;
      // The token arrived in the URL fragment; the session is already held in memory, so drop it
      // from this history entry rather than leaving a live recovery link in the browser history.
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* non-fatal */ }
    }
  });

  setTimeout(function () {
    if (!recoveryReady) invalidLink();
  }, 2000);

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errorMsg.hidden = true;

    var password = document.getElementById('password').value;
    var confirm = document.getElementById('confirmPassword').value;

    if (password.length < 8) {
      showError('Password must be at least 8 characters.');
      return;
    }
    if (password !== confirm) {
      showError('Passwords do not match.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Saving...';

    client.auth.updateUser({ password: password }).then(function (result) {
      if (result.error) {
        showError(result.error.message);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Set new password';
        return;
      }

      form.hidden = true;
      title.textContent = 'Password updated';
      subtitle.hidden = true;
      successMsg.textContent = 'Sign in with your new password in the Axis app, or on the web.';
      successMsg.hidden = false;
      webLink.hidden = false;
    });
  });
</script>
</body>
</html>
