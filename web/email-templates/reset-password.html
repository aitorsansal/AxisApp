<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your password</title>
<style>
  body {
    margin: 0;
    padding: 32px 16px;
    background: #0B1220;
    color: #E8ECF4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    max-width: 420px;
    margin: 0 auto;
    background: #121A2B;
    border: 1px solid #22304A;
    border-radius: 20px;
    padding: 32px 28px;
    text-align: center;
  }
  .mark {
    width: 48px;
    height: 48px;
    margin: 0 auto 24px;
  }
  h1 {
    font-size: 1.3rem;
    margin: 0 0 12px;
    color: #E8ECF4;
  }
  p {
    color: #8A93A6;
    line-height: 1.6;
    margin: 0 0 24px;
    font-size: 0.95rem;
  }
  .btn {
    display: inline-block;
    background: #F5A623;
    color: #08101F !important;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    padding: 14px 28px;
    border-radius: 12px;
    margin-bottom: 20px;
  }
  .fallback {
    font-size: 0.8rem;
    color: #5C6580;
    word-break: break-all;
    margin: 0 0 24px;
  }
  .fallback a {
    color: #5C6580;
  }
  .hint {
    font-size: 0.85rem;
    color: #5C6580;
    margin: 0;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="mark" src="https://axisapp.aitorsansal.com/email-assets/icon.svg" width="48" height="48" alt="Axis">
    <h1>Reset your password</h1>
    <p>We received a request to reset your Axis password. Follow the link below to choose a new one.</p>

    <a class="btn" href="{{ .ConfirmationURL }}">Reset password</a>

    <p class="fallback">Or paste this link into your browser:<br><a href="{{ .ConfirmationURL }}">{{ .ConfirmationURL }}</a></p>

    <p class="hint">If you didn't request this, you can safely ignore this email — your password won't change.</p>
  </div>
</body>
</html>
